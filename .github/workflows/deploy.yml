# Автодеплой: пуш в main → SSH на VPS → deploy/deploy.sh.
# Настройка и секреты — docs/deploy/auto-deploy.md.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Два деплоя одновременно пересобирали бы один и тот же стек.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Подготовить SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Обновить сервер
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "${PORT:-22}" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            "$USER_NAME@$HOST" "cd '$DIR' && ./deploy/deploy.sh"

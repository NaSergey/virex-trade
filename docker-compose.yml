# Full local stack: PostgreSQL + NestJS API + Next.js web.
# Start everything:   docker compose up --build
# Stop:               docker compose down   (add -v to also wipe the DB volume)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: virex
      POSTGRES_PASSWORD: virex
      POSTGRES_DB: virex
    # Только loopback: снаружи порт не слушается. Публикация на 0.0.0.0
    # означала бы базу, открытую из интернета вместе с парой virex/virex, —
    # мимо всей авторизации приложения. Локальные клиенты (psql, prisma
    # db execute, GUI) продолжают ходить на localhost:5432 как раньше.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U virex -d virex"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Loads JWT secrets + other backend config from the existing api env file...
    env_file:
      - ./backend/.env
    # ...and overrides the DB host to the compose service.
    environment:
      DATABASE_URL: postgresql://virex:virex@db:5432/virex?schema=public
      PORT: "8091"
      FRONTEND_URL: http://localhost:8090
    # Тоже loopback: наружу смотрит только web, а к api он ходит по
    # внутренней сети compose (API_INTERNAL_URL=http://api:8091).
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      - ./backend:/app
      - api_node_modules:/app/node_modules
    # Sync the schema to the DB (regenerating the client too, since the
    # api_node_modules volume persists across rebuilds and can hold a stale
    # client), then start with hot reload.
    command: sh -c "npx prisma db push && npm run start:dev"

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Server-only: the browser never calls this directly. Next proxies
      # /api/* and /auth/* to it via rewrites (next.config.ts), so the
      # browser and the app share one origin and the session cookie reaches
      # middleware.ts. Docker service name, not localhost — this runs
      # inside the web container's own network.
      API_INTERNAL_URL: http://api:8091
    ports:
      - "8090:8090"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    # Ставим зависимости на старте: web_node_modules переживает пересборку
    # образа, поэтому npm install из Dockerfile перекрывается старым volume
    # и новые пакеты (next-intl и т.п.) в контейнер не попадают.
    command: sh -c "npm install && npm run dev -- -p 8090 -H 0.0.0.0"

volumes:
  pgdata:
  api_node_modules:
  web_node_modules:
  web_next:
